[package]
name = "nephclick-photolab-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []

[dependencies]
nephclick-photolab-geom = { workspace = true }
nephclick-photolab-color = { workspace = true }
craft-cms = { workspace = true }
# PCTIP codec from craft-libs#1564; isolated pin until the shared revision is adopted workspace-wide.
craft-pcraft-tip = { package = "craft-pcraft-format", git = "https://github.com/nephclick/craft-libs", rev = "ecd5adb8a2fb95813a6498d52eaff35877b2e324" }
nephclick-photolab-raster = { workspace = true }
nephclick-photolab-doc = { workspace = true }
nephclick-photolab-ops = { workspace = true }
nephclick-photolab-compose = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
chrono = { workspace = true }
web-time = { workspace = true }
nephclick-photolab-paint = { workspace = true }
nephclick-photolab-algo = { workspace = true }
nephclick-photolab-text = { workspace = true }
nephclick-photolab-vector = { workspace = true }
nephclick-photolab-io = { workspace = true }
craft-xml = { workspace = true }
craft-psd = { workspace = true }
nephclick-photolab-format = { workspace = true }
nephclick-photolab-plugins = { workspace = true }
nephclick-photolab-ai = { workspace = true }
base64 = "0.23"
blake3 = { version = "1.8", default-features = false, features = ["pure"] }
nephclick-photolab-codecs = { workspace = true }
nephclick-photolab-formats = { workspace = true }
flate2 = { workspace = true }
craft-print = { workspace = true }
# The framework through its facade: the actions model (`craft::automation`), the `.kys` model
# (`craft::keymap`), the palette (`craft::color_ui`), preferences storage and autosave
# (`craft::settings`, `craft::platform`), and `craft::theme::ThemeId`, the theme ids the
# appearance preferences hold.
craft = { workspace = true, features = ["automation", "color-ui", "keymap", "platform", "settings"] }

# Release tags use the same semantic versions as Cargo.
semver = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3"
# `clock`: the local time that names History Options' snapshot on save (#2966); already in the
# tree through rmcp. The web build has no local clock here and names it "Snapshot N".
chrono = { workspace = true, features = ["clock"] }

# `file_cmds::same_file` on Windows: the volume serial number and file index, so a hard link to a
# file is that file (std's `MetadataExt::file_index` is unstable).
[target.'cfg(windows)'.dependencies]
same-file = "1"
# `file.print` loads Windows.Data.Pdf.dll before calling into it (#5884): the safe binding
# ui-egui and craft-print already use, pinned to the same version.
winsafe = { version = "=0.0.29", default-features = false, features = ["kernel"] }

# Printing on Unix: an IPP client for CUPS (pure Rust); the web build cannot print.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "windows")))'.dependencies]
nephclick-photolab-ipp = { workspace = true }

[dev-dependencies]
craft-affinity = { workspace = true, features = ["synth"] }
nephclick-photolab-io = { workspace = true, features = ["testgen"] }
# Synthetic camera raw files for the open tests.
nephclick-photolab-raw = { workspace = true, features = ["testgen"] }
nephclick-photolab-testkit = { workspace = true }
exr = { version = "1.73", default-features = false }
# WebAssembly text -> binary for plug-in test modules (Apache-2.0 WITH LLVM-exception).
wat = "1.228"
# Synthetic multi-part EXR fixtures for the parts-commands tests.
